augmentation:
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.3
  random_rotate90_p: 0.3
  shift_scale_rotate:
    shift_limit: 0.05
    scale_limit: 0.10
    rotate_limit: 15
    p: 0.5
  elastic_transform:
    alpha: 60.0
    sigma: 4.0
    p: 0.3
  grid_distortion:
    num_steps: 5
    distort_limit: 0.3
    p: 0.2
  random_crop:
    height: 96
    width: 96
    p: 0.3
  random_gamma:
    gamma_limit: [80, 120]
    p: 0.3
  brightness_contrast:
    brightness_limit: 0.2
    contrast_limit: 0.2
    p: 0.4
  gauss_noise:
    var_limit: [0.001, 0.005]
    p: 0.3
  gaussian_blur:
    blur_limit: 3
    p: 0.2
  coarse_dropout:
    max_holes: 4
    max_height: 12
    max_width: 12
    p: 0.2
  advanced:
    targeted_zoom:
      enabled: false
      zoom_range: [0.5, 1.5]
      p: 0.5
    elastic_deformer:
      enabled: false
      alpha: 120.0
      sigma: 10.0
      p: 0.4
    multiscale:
      enabled: false
      scales: [128, 192, 256]
    attention_guided:
      enabled: false
      p: 0.5
