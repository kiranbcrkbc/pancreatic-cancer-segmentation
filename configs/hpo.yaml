hpo:
  study_name: "pancreatic_hpo_optuna"
  direction: "maximize"
  n_trials: 12
  epochs_per_trial: 3
  subset_samples: 200
  seed: 42
  pruner:
    type: "MedianPruner"
    n_startup_trials: 3
    n_warmup_steps: 1
  search_space:
    lr:
      type: "float"
      low: 1.0e-5
      high: 1.0e-3
      log: true
    weight_decay:
      type: "float"
      low: 1.0e-6
      high: 1.0e-3
      log: true
    batch_size:
      type: "categorical"
      choices: [4, 8]
    dropout:
      type: "float"
      low: 0.0
      high: 0.3
      step: 0.05
    transformer_depth:
      type: "categorical"
      choices: [2, 3, 4]
    num_heads:
      type: "categorical"
      choices: [4, 8]
    embed_dim:
      type: "categorical"
      choices: [128, 256]
    optimizer:
      type: "categorical"
      choices: ["Adam", "AdamW"]
  aquila:
    population_size: 10
    max_iter: 10
    dim: 8
